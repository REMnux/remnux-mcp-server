name: CI

# Regression gate: runs the deterministic test suite, lint, and build on every
# branch push and pull request. Tag pushes are intentionally excluded here —
# they trigger publish.yml (Publish to NPM) instead.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: pnpm install --frozen-lockfile

      # Build must precede test: the `pretest` hook (scripts/check-stale-build.ts)
      # fails when dist/ is missing or older than src/.
      - run: pnpm run build

      - run: pnpm run lint

      # Runs here rather than in `pretest`: it has documented false-positive
      # paths (see the header of the script), and a false positive in pretest
      # would block every local test run.
      - run: node scripts/audit-overrides.mjs
      # The failure paths too: a plain run on a clean configuration cannot tell
      # a working checker from one whose checks silently stopped firing.
      - run: node scripts/audit-overrides.mjs --selftest

      # The committed suite is deterministic and self-contained. The radare2
      # golden test (src/__tests__/verify-string-usage.golden.test.ts) is gated
      # behind R2_GOLDEN_TEST, which is intentionally NOT set here: it needs a
      # running REMnux container with the exact radare2 version the distro ships
      # (6.1.6), and ubuntu-latest's apt radare2 is a different version whose JSON
      # shape would produce false "version drift" failures. That golden test — and
      # the real-sample sweep in scripts/validate-release.mjs — stay maintainer
      # gates, run locally against a real REMnux container before a release.
      - run: pnpm test

  # GHSA-qp43-2vqh-w88w only fired under cmd.exe, so the platform that matters
  # most for the connector's shell-free invariant is the one the Linux job cannot
  # exercise. This job runs the argv-boundary regression suite on Windows.
  #
  # Scoped to that suite rather than the whole `pnpm test`: the build script is
  # POSIX-only (`cp -r`, `chmod +x`), and vitest transforms TypeScript directly,
  # so these tests need no dist/. Widen the glob once the build is cross-platform.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: pnpm install --frozen-lockfile

      # docker-cp-argv: the shell-free invariant.
      # resolve-executable: PATH resolution, whose win32 branch is the one that
      #   matters and which this runner exercises natively.
      # binary-planting: plants a real decoy in the cwd and asserts the
      #   resolver, using the real filesystem probe, does not select it.
      - run: >
          pnpm exec vitest run
          src/__tests__/docker-cp-argv.test.ts
          src/__tests__/resolve-executable.test.ts
          src/__tests__/binary-planting.test.ts
