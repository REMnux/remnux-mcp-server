version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    # Matches minimumReleaseAge in pnpm-workspace.yaml (10080 minutes = 7 days).
    # Without this, Dependabot proposes releases that pnpm will then refuse to
    # install, producing PRs that cannot pass CI.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Grouped so a routine week is one PR to review rather than a dozen.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@types/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "tsx"
          - "husky"
          - "lint-staged"
        update-types:
          - minor
          - patch
      runtime:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "dockerode"
          - "ioc-extractor"
          - "ssh2"
          - "zod"
        update-types:
          - minor
          - patch
      # Catch-all for whatever the two named groups miss. NOT a security group:
      # security updates are ungrouped unless `applies-to: security-updates` is
      # set, so the previous name "transitive-security" claimed something this
      # does not do.
      remaining-transitive:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      # CORRECTION: `ignore` DOES apply to security updates, not only version
      # updates, so an ignored major can mean no security PR is opened (the
      # alert still appears). Ignores are therefore limited to DEV tooling,
      # where a major lands through a deliberate migration -- vitest 1 -> 4
      # needed a new config file, because its default exclude no longer covers
      # dist/ and an unscoped run silently doubled the collected suite, plus a
      # peer declared by hand. RUNTIME dependencies are deliberately NOT
      # ignored: for a security tool, receiving the PR matters more than the
      # noise of an occasional major.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
