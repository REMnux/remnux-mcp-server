version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    # Matches minimumReleaseAge in pnpm-workspace.yaml (10080 minutes = 7 days).
    # Without this, Dependabot proposes releases that pnpm will then refuse to
    # install, producing PRs that cannot pass CI.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Grouped so a routine week is one PR to review rather than a dozen.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@types/*"
          - "typescript*"
          - "vite"
          - "vitest"
          - "tsx"
          - "husky"
          - "lint-staged"
        update-types:
          - minor
          - patch
      runtime:
        patterns:
          - "@modelcontextprotocol/sdk"
          - "dockerode"
          - "ioc-extractor"
          - "ssh2"
          - "zod"
        update-types:
          - minor
          - patch
      # Catch-all for whatever the two named groups miss. NOT a security group:
      # security updates are ungrouped unless `applies-to: security-updates` is
      # set, so the previous name "transitive-security" claimed something this
      # does not do.
      remaining-transitive:
        patterns:
          - "*"
        update-types:
          - patch
    ignore:
      # WHICH ignores are safe here, and why (corrected 2026-08-21).
      #
      # An earlier note said flatly that `ignore` applies to security updates as
      # well as version updates. That is true of `versions:` conditions and NOT
      # true of `update-types:`-only conditions. GitHub documents it: "update-types
      # only affects version updates, not security updates" and "Security updates
      # will always be created regardless of the update-types setting"
      # (docs.github.com -> Controlling which dependencies are updated).
      # dependabot-core agrees: updater/lib/dependabot/job.rb logs
      # " (doesn't apply to security update)" for an update_types condition when
      # the job is security_updates_only.
      #
      # THE RULE THAT FOLLOWS:
      #   * Every entry below is `update-types:`-only. Routine major PRs stop;
      #     security PRs still arrive. Keep it that way.
      #   * NEVER add a `versions:` ignore for a runtime dependency -- that form
      #     DOES suppress security updates, which is the trap the old note was
      #     reaching for.
      #   * A runtime entry needs a documented reason and a migration plan. Dev
      #     tooling needs neither: a dev major lands through deliberate migration
      #     (vitest 1 -> 4 needed a new config file, because its default exclude
      #     no longer covers dist/ and an unscoped run silently doubled the
      #     collected suite, plus a peer declared by hand), and dev packages never
      #     enter the published tree.
      #
      # Two backstops make this safe even if that behaviour ever regresses:
      # Dependabot ALERTS are unaffected by `ignore` entirely, and
      # scripts/verify-consumer-tree.mjs blocks the publish on any advisory in the
      # tree a consumer would actually receive.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node stays on the SAME MAJOR as engines.node (">=20.0.0"). Typing
      # against Node 26 would let src/ compile against APIs absent on a Node 20
      # REMnux box, and no job here would catch it because CI runs Node 22.
      # Precisely: ^20 resolves to 20.19.x, so this bounds type drift to the
      # Node 20 API surface -- it does not pin to 20.0.0, and APIs added later
      # in the 20.x line are still reachable. Raise this with engines.node, not
      # before it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # lint-staged 17 requires Node >=22.22.1, a whole major above this
      # package's floor. The 16.x line in use requires >=20.17, which stays
      # inside the supported major. Dev-only and never in the published `files`
      # tree, so staying on 16 costs nothing on the consumer side.
      - dependency-name: "lint-staged"
        update-types: ["version-update:semver-major"]
      # zod is the ONE runtime entry, and it is here because the major was
      # declined on measured evidence, not to reduce noise for its own sake.
      # Under zod 4 the MCP SDK's schema conversion drops
      # `additionalProperties: false` from every tool input schema that takes
      # arguments -- 16 of 19 -- silently opening the wire contract while the
      # whole suite stays green. Without this entry, every 4.x release reopens
      # that PR and re-asks a settled question, and the failure mode is one
      # reflex merge. Migration plan if zod 3 must be left: move
      # src/schemas/tools.ts to z.strictObject(), or register tools through
      # registerTool with full schemas rather than passing .shape to
      # server.tool(), then confirm the "tools/list wire contract" test in
      # src/__tests__/tool-handlers.test.ts still passes -- it asserts exactly
      # this invariant and fails loudly under zod 4 today.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
