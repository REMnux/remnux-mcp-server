blockExoticSubdeps: true
# 10080 minutes = 7 days (pnpm 10.x uses minutes despite docs saying seconds)
minimumReleaseAge: 10080
# Supply chain security policies
onlyBuiltDependencies:
  - esbuild
  - workerd
  - cpu-features
overrides:
  # bounded to the 1.x line the sdk declares (^1.19.9). GHSA-frvp-7c67-39w9 affects
  # BOTH >=2.0.0 <2.0.5 AND <1.19.15, so the previous open-ended '>=1.19.13' was
  # doubly wrong: it sat inside the vulnerable 1.x range, and it crossed into 2.x
  # where the sdk never declared support.
  '@hono/node-server@<1.19.15': '>=1.19.15 <2'
  '@protobufjs/utf8@<=1.1.0': '>=1.1.1'
  # bounded to the 1.x line: minimatch@3 declares brace-expansion ^1.1.7, and the
  # previous open-ended '>=1.1.13' crossed into 5.x, where a later rule could no
  # longer reach it (first matching override wins on the declared spec)
  brace-expansion@<1.1.18: '>=1.1.18 <2'
  brace-expansion@>=4.0.0 <5.0.5: '>=5.0.5'
  brace-expansion@>=5.0.0 <5.0.6: '>=5.0.6'
  # bounded to the 5.x line, same reason as fast-uri below
  brace-expansion@>=4.0.0 <5.0.9: '>=5.0.9 <6'
  esbuild@<=0.24.2: '>=0.25.0'
  fast-uri@<=3.1.0: '>=3.1.1'
  fast-uri@<=3.1.1: '>=3.1.2'
  # bounded to the 3.x line: ajv declares fast-uri ^3.0.1, and an open-ended
  # '>=3.1.4' resolves to 4.x, crossing ajv's declared range
  fast-uri@<=3.1.3: '>=3.1.4 <4'
  # NOTE: no hono rules. The sdk declares ^4.11.4, which has always permitted every
  # patched version, so the six rungs removed here never bound anything.
  # NOTE: no ip-address rule. express-rate-limit declares ^10.2.0 and resolves 10.5.0,
  # which is clean. The removed 'ip-address@<=10.1.0' rule was actively harmful: both
  # GHSA-22jq-vg5j-6vgg and GHSA-4xrf-jv44-h6hh affect >=10.1.1, so forcing the tree
  # off 10.1.0 moved it INTO the vulnerable window.
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0'
  postcss@<8.5.10: '>=8.5.10'
  # bounded to the 7.x line dockerode declares (^7.3.2). GHSA-j3f2-48v5-ccww affects
  # 7.x <=7.6.4 and GHSA-f38q-mgvj-vph7 affects <=7.6.2, so 7.6.5 is the real floor;
  # the previous open-ended '>=7.5.8' both permitted vulnerable 7.x and crossed into
  # 8.x, where all three current advisories live and dockerode declares no support.
  'protobufjs@<7.6.5': '>=7.6.5 <8'
  qs@>=6.11.1 <=6.15.1: '>=6.15.2'
  # NOTE: no uuid rule. GHSA-w5hq-g745-h8pq affects v3()/v5()/v6() only when the
  # CALLER supplies a short buf or a bad offset. dockerode is the only uuid
  # consumer in the graph and calls v4() with no arguments (lib/session.js:4,7);
  # v4() throws RangeError rather than truncating, so the advisory is unreachable.
  # The removed rule `uuid@<11.1.1: '>=11.1.1'` was open-ended and resolved uuid
  # 14, four majors past dockerode's declared ^10.0.0. uuid >=12 is ESM-only and
  # dockerode require()s it eagerly, so require('dockerode') threw ERR_REQUIRE_ESM
  # on Node 20.0-20.18 -- inside this package's own engines range. Do NOT re-add a
  # uuid override to clear the audit finding: `pnpm audit --prod` reporting this
  # advisory is the accepted, cheaper cost. pnpm's auditConfig.ignoreGhsas was
  # tested in both pnpm-workspace.yaml and package.json under pnpm 10.33 and
  # suppressed nothing in either location, so the finding is dismissed on the
  # GitHub Dependabot alert instead, where the rationale stays visible.
  # Revisit when dockerode 5 lands: it drops the uuid dependency entirely.
